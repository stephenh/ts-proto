syntax = "proto3";
package simple;

import "google/protobuf/wrappers.proto";

message Object {
  string name = 1;
  map<string, string> metadata = 2;
}

message Error {
  string name = 1;
}

message String {
  string value = 1;
}

message Boolean {
  bool value = 1;
}

message Number {
  double value = 1;
}

message Array {
  repeated String values = 1;
}

message WithWrappers {
  google.protobuf.StringValue name = 1;
  google.protobuf.BoolValue enabled = 2;
  google.protobuf.Int32Value age = 3;
}
