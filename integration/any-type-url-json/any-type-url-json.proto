syntax = "proto3";

package foo.bar;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";

message Person {
  string first_name = 1;
  string last_name = 2;
}

message Holder {
  google.protobuf.Any item = 1;
  repeated google.protobuf.Any items = 2;
  google.protobuf.Duration timeout = 3;
}
